[package]
name = "simulator"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = "off"
opt-level = 2
codegen-units = 16
debug = "none"

[profile.release-full]
inherits = "release"
lto = "fat"
opt-level = 2
codegen-units = 1
debug = "none"

[profile.release.package."*"]
opt-level = 2

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cgmath = "0.18.0"
egui = { git = "https://www.github.com/emilk/egui.git", rev = "cb2b306f1157aebb7dc47a5809f58318aeaa0e59" }
egui-wgpu = { git = "https://www.github.com/emilk/egui.git", rev = "cb2b306f1157aebb7dc47a5809f58318aeaa0e59" }
egui-winit = { git = "https://www.github.com/emilk/egui.git", rev = "cb2b306f1157aebb7dc47a5809f58318aeaa0e59" }
env_logger = "0.11.11"
gilrs = "0.11.2"
gltf = { version = "1.4.1", features = ["KHR_texture_transform"] }
iceoryx2 = { git = "https://github.com/eclipse-iceoryx/iceoryx2.git" }
image = { version = "0.25.10", features = ["png", "jpeg"] }
log = "0.4.33"
nalgebra = "0.35.0"
pollster = "1.0.1"
rapier3d = { version = "0.35.3", features = ["parallel", "serde-serialize"] }
roboscope-ipc = { path = "../roboscope/ipc", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wgpu = "30.0.0"
winit = "0.30.13"